<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Bootstrap</title>

    <link rel="stylesheet" href="style/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="tema-escuro">

<header></header>

<main>

    <!-- Página 1 Login -->
    <div class="container" id="pagina1">
        <div class="row">
            <div class="col-md-3 p-0"></div>

            <div class="col-md-6">

                <h1 class="text-center display-1 fw-bold titulo">QUIZ BOOTSTRAP</h1>
                <p class="text-center p-4 subtitulo">FAÇA O SEU CADASTRO ABAIXO</p>

                <div class="text-center">
                    <img src="imagens/quiz1.png" class="img-fluid w-50 rounded sombra" alt="Imagem do Quiz">
                </div>

                <label for="Nick" class="mt-3">Nickname</label>
                <input type="text" id="Nick" class="form-control inputModern" minlength="4" maxlength="12" required>

                
                <div class="mt-4">
                    <label class="form-label">Selecione o estilo do quiz:</label>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tema" id="temaEscuro" checked>
                        <label class="form-check-label" for="temaEscuro">
                            Tema Escuro
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tema" id="temaClaro">
                        <label class="form-check-label" for="temaClaro">
                            Tema Claro
                        </label>
                    </div>
                </div>

                <button id="btnAvancar" class="btn btn-primary mt-3 w-100 botaoModern">Avançar</button>

            </div>

            <div class="col-md-3 p-0"></div>
        </div>
    </div>

    <!-- Página 2 → Quiz -->
    <section id="pagina2" style="display: none;">
        <div class="containerCentral">

            <h3 id="perguntaTitulo" class="mt-4 pergunta"></h3>

            <div id="opcoesContainer" class="mt-4"></div>

            <button id="btnResponder" class="btn btn-success btn-lg mt-4 botaoModern">Responder</button>

            <p id="progresso" class="mt-3 progresso"></p>

            <!-- Resultado Final -->
            <div id="resultadoFinal" class="resultado" style="display:none;">
                <h2 class="fw-bold">Resultado Final</h2>

                <h3>Você acertou <span id="acertosFinal"></span> de 10!</h3>

                <h3 id="mensagemFinal" class="mt-3"></h3>

                <button id="btnRecomecar" class="btn btn-primary botaoModern mt-4" style="display:none;">Recomeçar</button>

                <p class="mt-3" id="ultimaPontuacao"></p>
            </div>

        </div>
    </section>

</main>

<footer class="text-center mt-4 mb-3">
    <small>Quiz Bootstrap - Projeto Game</small>
</footer>

<a href="https://youtu.be/-ro7En3iU2Y?si=ck7tiuJKiXbAqSK-" class="link-baixo" target="_blank">LINK DO VIDEO + CODIGO EXPLICAÇÃO</a>


<script src="script/script.js"></script>

</body>
</html>
